name: Build and publish journey-v2 preview

on:
  push:
    branches: [feature/journey-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview-v2
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/journey-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Patch vite.config.ts for /Tawafok/preview/ base
        run: |
          sed -i "s|base: isGitHubPages ? '/tawasul-marriage-platform/' : '/',|base: process.env.VITE_BASE_PATH || (isGitHubPages ? '/tawasul-marriage-platform/' : '/'),|" vite.config.ts
          grep 'base:' vite.config.ts

      - name: Build preview
        run: npm run build
        env:
          VITE_DATABASE_PROVIDER: local
          GITHUB_ACTIONS: 'true'
          VITE_BASE_PATH: '/Tawafok/preview/'

      - name: Prepare static files
        run: |
          rm -f dist/server.cjs dist/server.cjs.map
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy to gh-pages preview/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: preview
          keep_files: true
