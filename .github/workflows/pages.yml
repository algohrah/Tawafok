name: Build and publish GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project from zip
        run: |
          unzip -o "tawasul-marriageالاخير.zip" -d extracted
          sed -i "s#'/tawasul-marriage-platform/'#'/Tawafok/'#" extracted/tawasul-marriage-platform-main/vite.config.ts

      - name: Install dependencies
        working-directory: extracted/tawasul-marriage-platform-main
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build local-data preview
        working-directory: extracted/tawasul-marriage-platform-main
        run: npm run build
        env:
          VITE_DATABASE_PROVIDER: local

      - name: Prepare static preview
        working-directory: extracted/tawasul-marriage-platform-main
        run: |
          rm -f dist/server.cjs dist/server.cjs.map
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: extracted/tawasul-marriage-platform-main/dist
          force_orphan: true
